# Internal AI service (services/ai/Dockerfile, target `production`).
#
# ClusterIP only and absent from the Ingress: only the API and worker call it
# (ADR 0003), and network-policy.yaml enforces that at the network layer too.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai
  labels: { app.kubernetes.io/name: ai }
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app.kubernetes.io/name: ai }
  template:
    metadata:
      labels: { app.kubernetes.io/name: ai }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: ai
          image: janmaang-ai
          ports:
            - { name: http, containerPort: 8001 }
          envFrom:
            - configMapRef: { name: janmaang-config }
            - secretRef: { name: janmaang-ai }
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { memory: 1536Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: ai
  labels: { app.kubernetes.io/name: ai }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: ai }
  ports:
    - { name: http, port: 8001, targetPort: http }
