# The AI service accepts traffic from the API and the worker only.
#
# Enforced by the cluster's CNI; on a cluster without NetworkPolicy support this
# object is accepted and ignored, so the ClusterIP-only Service is the first
# line and this is the second, not the other way round.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ai-ingress
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: ai }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [api, worker]
      ports:
        - { protocol: TCP, port: 8001 }
