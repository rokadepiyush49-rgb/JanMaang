# Background jobs (arq). Same image as the API, different command — see
# docker-compose.yml for why they are not split.
#
# No Service and no HPA: it serves no traffic, and arq scales by queue depth,
# which needs KEDA or a custom metric rather than CPU. Raise `replicas` in the
# overlay until that exists.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels: { app.kubernetes.io/name: worker }
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app.kubernetes.io/name: worker }
  template:
    metadata:
      labels: { app.kubernetes.io/name: worker }
    spec:
      automountServiceAccountToken: false
      # Give an in-flight job time to finish before SIGKILL.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: worker
          image: janmaang-api
          command: ["arq", "app.worker.WorkerSettings"]
          envFrom:
            - configMapRef: { name: janmaang-config }
            - secretRef: { name: janmaang-api }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 768Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 128Mi }
