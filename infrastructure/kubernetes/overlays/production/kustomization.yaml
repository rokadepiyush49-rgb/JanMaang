# Production: applied by deploy-production.yml after approval, using images
# retagged from a SHA already verified on staging.
#   kubectl apply -k infrastructure/kubernetes/overlays/production
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: janmaang-production

resources:
  - namespace.yaml
  - ../../base

images:
  - { name: janmaang-web, newName: ghcr.io/rokadepiyush49-rgb/janmaang/web, newTag: production }
  - { name: janmaang-api, newName: ghcr.io/rokadepiyush49-rgb/janmaang/api, newTag: production }
  - { name: janmaang-ai, newName: ghcr.io/rokadepiyush49-rgb/janmaang/ai, newTag: production }

patches:
  - target: { kind: ConfigMap, name: janmaang-config }
    patch: |-
      - { op: replace, path: /data/ENVIRONMENT, value: production }
  # Three API replicas across zones survive a zone loss with headroom.
  - target: { kind: HorizontalPodAutoscaler, name: api }
    patch: |-
      - { op: replace, path: /spec/minReplicas, value: 3 }
      - { op: replace, path: /spec/maxReplicas, value: 12 }
  - target: { kind: Deployment, name: api }
    patch: |-
      - { op: replace, path: /spec/replicas, value: 3 }
  - target: { kind: Deployment, name: "worker|ai" }
    patch: |-
      - { op: replace, path: /spec/replicas, value: 2 }
  - target: { kind: Ingress, name: janmaang }
    patch: |-
      - { op: replace, path: /spec/tls/0/hosts/0, value: janmaang.in }
      - { op: replace, path: /spec/rules/0/host, value: janmaang.in }
